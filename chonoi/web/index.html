<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · Esc/P = tạm dừng · R = chơi lại · H = tương phản cao.
 * Màn: menu chính, DayIntro / EveningIntro / DayResult (cổng `gate` do máy chủ giữ, Enter để qua),
 *      Shop (1/2 mua, Enter xong), Summary, tạm dừng. Cảnh vẽ theo `snap.phase` (gather | quan | shop).
 * Cảnh báo (chữ + biểu tượng tam giác, không chỉ dựa màu): thủy quái gần, oxy sắp hết / hết hơi, khách sắp giận.
 * URL: ?hc=1 bật tương phản cao; ?bench=<giây>&warmup=<giây> do chonoi.bench dùng để đo FPS ở 1280×720.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const params = new URLSearchParams(location.search);
const BENCH = Number(params.get("bench")) > 0 ? { duration: Number(params.get("bench")), warmup: Number(params.get("warmup") ?? 3) } : null;
let hc = params.get("hc") === "1";
if (!params.has("hc")) { try { hc = localStorage.getItem("chonoi.hc") === "1"; } catch (e) { /* storage bị chặn */ } }
function toggleHc() {
  hc = !hc;
  try { localStorage.setItem("chonoi.hc", hc ? "1" : "0"); } catch (e) { /* storage bị chặn */ }
}
let hits = [];                       // vùng bấm chuột, dựng lại mỗi khung hình
const toasts = [], seenEv = new Set();

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
           pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function sendRaw(path, body) {
  return fetch(path, { method: "POST", body: body ? JSON.stringify(body) : undefined, headers: { "Content-Type": "application/json" } }).catch(() => {});
}
function pulse(name) {            // nút bấm một lần: giữ ~60 ms để sim thấy cạnh lên
  down.add(name); pushInput();
  setTimeout(() => { down.delete(name); pushInput(); }, 60);
}
function buy(name) { sendRaw("/input", { buy: name }); }
function advance() {               // Enter / click ở màn có cổng
  if (!snap || !snap.gate) return false;
  sendRaw(snap.gate === "menu" ? "/start" : "/continue");
  lastSent = ""; down.clear();
  return true;
}
function restart() { sendRaw("/restart"); lastSent = ""; down.clear(); }
function togglePause() { if (snap && !snap.gate && !snap.finished) pulse("pause"); }
function shopKeys() { return Object.keys(((snap && snap.catalog && snap.catalog.shop) || {}).upgrades || {}); }
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (k === "h") { toggleHc(); return; }
  if (snap && snap.gate) {         // menu / giới thiệu / kết quả: chỉ Enter, Space, E đi tiếp; R chơi lại
    if (k === "enter" || k === " " || k === "e") { advance(); e.preventDefault(); }
    else if (k === "r" && snap.gate !== "menu") restart();
    return;
  }
  if (k === "escape" || k === "p") { togglePause(); e.preventDefault(); return; }
  if (snap && snap.phase === "shop" && !snap.finished) {
    const ups = shopKeys(), i = parseInt(k, 10);
    if (i >= 1 && i <= ups.length) buy(ups[i - 1]);
    else if (k === "enter" || k === " ") { pulse("shop_done"); e.preventDefault(); }
    else if (k === "r") restart();
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") restart();
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
addEventListener("click", (e) => {
  for (const h of hits) if (e.clientX >= h.x && e.clientX <= h.x + h.w && e.clientY >= h.y && e.clientY <= h.y + h.h) { h.fn(); return; }
});

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    collectToasts();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển" };
const dishName = (d) => DISH_NAME[d] || d || "?";
const UP_NAME = { oxygen: "Bình oxy", hp: "Máu tối đa" };
const upLabel = (lv) => Object.keys(lv).filter((k) => k !== "level" && k !== "price").map((k) => (k === "oxygen_max_s" ? "Oxy " + lv[k] + "s" : k === "hp_max" ? "Máu " + lv[k] : k + " " + lv[k])).join(", ");
// Độ tươi (Phase 3, v1.2): giỏ = mảng cá thể {id, kind, fresh}; kho = mảng cá thể. Vẫn đọc được dạng cũ
// (giỏ = mảng chuỗi kind, kho = {kind: số}) nên client không vỡ khi sim chưa đổi schema.
const spoiledBelow = () => ((snap && snap.catalog && snap.catalog.freshness) || {}).spoiled_below ?? 30;
function itemsOf(list) {
  return (list || []).map((x) => (typeof x === "string" ? { kind: x, fresh: null } : { id: x.id, kind: x.kind, fresh: x.fresh ?? null }));
}
function stockItems(stock) {
  if (Array.isArray(stock)) return itemsOf(stock);
  const out = [];
  Object.keys(stock || {}).sort().forEach((k) => { for (let i = 0; i < stock[k]; i++) out.push({ kind: k, fresh: null }); });
  return out;
}
const isSpoiled = (it) => it.fresh !== null && it.fresh !== undefined && it.fresh < spoiledBelow();
const freshColor = (f) => (f === null || f === undefined ? "#bbbbbb" : f < spoiledBelow() ? "#ef5350" : f < 60 ? "#ffca28" : "#9ccc65");
function summarize(items) {
  const g = {};
  items.forEach((it) => {
    const e = g[it.kind] || (g[it.kind] = { n: 0, bad: 0, sum: 0, known: 0 });
    e.n++;
    if (isSpoiled(it)) e.bad++;
    if (it.fresh !== null && it.fresh !== undefined) { e.sum += it.fresh; e.known++; }
  });
  const parts = Object.keys(g).sort().map((k) => {
    const e = g[k];
    return (KIND_NAME[k] || k) + " ×" + e.n + (e.known ? " (tươi " + Math.round(e.sum / e.known) + ")" : "") + (e.bad ? " · ươn " + e.bad : "");
  });
  return { text: parts.join(", "), bad: items.filter(isSpoiled).length };
}
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = BENCH ? 1 : window.devicePixelRatio || 1;
  const w = BENCH ? 1280 : innerWidth, h = BENCH ? 720 : innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = hc && !o.keep ? "#ffffff" : o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = hc ? "#ffffff" : "rgba(255,255,255,.5)"; ctx.lineWidth = hc ? 2 : 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: hc ? 13 : 11, align: "center", bold: hc });
}
function hcStroke() { if (hc) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); } }
// Tam giác "!" vẽ bằng path: không phụ thuộc font emoji.
function warnIcon(x, y, size, fill, mark) {
  ctx.beginPath(); ctx.moveTo(x, y - size / 2); ctx.lineTo(x + size / 2, y + size / 2); ctx.lineTo(x - size / 2, y + size / 2); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = mark; ctx.lineWidth = 2; ctx.stroke();
  text("!", x, y + size / 2 - 3, { size: Math.round(size * 0.7), align: "center", color: mark, keep: true, bold: true });
}
// Dải cảnh báo; ở tương phản cao: nền vàng, chữ đen, viền dày trắng/đen để nhận bằng hình dạng.
function warn(msg, cx, y, color) {
  ctx.font = "bold 28px system-ui, sans-serif";
  const tw = ctx.measureText(msg).width + 76, x = cx - tw / 2;
  ctx.fillStyle = hc ? "#ffff00" : "rgba(8,14,20,.85)"; ctx.fillRect(x, y - 30, tw, 42);
  if (hc) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 6; ctx.strokeRect(x - 3, y - 33, tw + 6, 48); ctx.strokeStyle = "#000000"; ctx.lineWidth = 3; ctx.strokeRect(x, y - 30, tw, 42); }
  else { ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.strokeRect(x, y - 30, tw, 42); }
  warnIcon(x + 26, y - 9, 26, hc ? "#000000" : color, hc ? "#ffff00" : "#10161c");
  text(msg, x + 46, y, { size: 28, color: hc ? "#000000" : color, keep: true, bold: true });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
const TOAST_TEXT = {
  hold_full: () => "Giỏ đầy!", faint: () => "Bạn ngất rồi!", gather: (d) => "Hái " + (KIND_NAME[d.kind] || d.kind || ""),
  fish_caught: (d) => "Bắt được " + (KIND_NAME[d.kind] || d.kind || ""), customer_left: () => "Khách bỏ đi (-uy tín)",
  paid: (d) => "Khách trả tiền" + (d.tip ? " + boa" : ""), bought: (d) => "Đã mua " + (UP_NAME[d.upgrade] || d.upgrade) + " cấp " + d.level,
  buy_failed: (d) => "Không mua được: " + ({ funds: "thiếu tiền", max_level: "đã tối đa", unknown: "không có" }[d.reason] || d.reason),
  spoiled: (d) => "Hàng bị ươn" + (d.location === "stock" ? " trong kho" : " trong giỏ") + "!", dish_ready: () => "Món chín!", no_dish: () => "Khách không có món để chọn",
};
function collectToasts() {
  for (const e of snap.events || []) {
    const key = e.tick + "|" + e.name + "|" + JSON.stringify(e.data || {});
    if (seenEv.has(key)) continue;
    seenEv.add(key);
    if (seenEv.size > 400) seenEv.delete(seenEv.values().next().value);
    if (TOAST_TEXT[e.name]) toasts.push({ t: TOAST_TEXT[e.name](e.data || {}), until: performance.now() + 2200 });
  }
  while (toasts.length > 4) toasts.shift();
}
function drawToasts(w) {
  const now = performance.now();
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].until < now) toasts.splice(i, 1);
  toasts.forEach((t, i) => {
    ctx.font = "20px system-ui, sans-serif";
    const tw = ctx.measureText(t.t).width + 24;
    ctx.fillStyle = "rgba(8,14,20,.78)"; ctx.fillRect(w / 2 - tw / 2, 78 + i * 26, tw, 26);
    text(t.t, w / 2, 97 + i * 26, { size: 20, align: "center", color: "#ffe082" });
  });
}
function button(x, y, w, h, label, fn, o = {}) {
  ctx.fillStyle = o.disabled ? (hc ? "#000000" : "rgba(255,255,255,.08)") : hc ? "#ffff00" : "rgba(255,193,7,.9)"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hc ? "#ffffff" : "rgba(255,255,255,.6)"; ctx.lineWidth = hc ? 3 : 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  text(label, x + w / 2, y + h / 2 + 7, { size: 20, align: "center", color: o.disabled ? (hc ? "#ffffff" : "#90a4ae") : hc ? "#000000" : "#2a1a0a", keep: true, bold: hc });
  if (!o.disabled) hits.push({ x, y, w, h, fn });
}
function panel(w, h, pw, ph, title) {
  const x = (w - pw) / 2, y = (h - ph) / 2;
  ctx.fillStyle = hc ? "#000000" : "rgba(8,14,20,.92)"; ctx.fillRect(x, y, pw, ph);
  ctx.strokeStyle = hc ? "#ffffff" : "rgba(255,255,255,.35)"; ctx.lineWidth = hc ? 4 : 2; ctx.strokeRect(x, y, pw, ph);
  text(title, w / 2, y + 46, { size: 30, align: "center", color: hc ? "#ffff00" : "#ffe082", keep: true });
  return { x, y };
}
function lines(arr, x, y, o = {}) { arr.forEach((l, i) => text(l, x, y + i * (o.gap || 28), { size: o.size || 20, align: o.align || "left", color: o.color || "#e8eef2" })); }
function planLines() {
  const pl = snap.day_plan || {}, out = [];
  const dishes = Object.keys(pl.dishes || {}).sort();
  if (dishes.length) out.push("Món dự kiến: " + dishes.map((d) => dishName(d) + " ×" + pl.dishes[d]).join(", "));
  const ing = Object.keys(pl.ingredients || {}).sort();
  if (ing.length) out.push("Nguyên liệu cần: " + ing.map((k) => (KIND_NAME[k] || k) + " ×" + pl.ingredients[k]).join(", "));
  return out;
}
function modeTitle() { return snap.mode === "day" ? "Một ngày ở chợ nổi" : snap.mode === "gather" ? "Buổi sáng — Lặn & Hái" : "Buổi tối — Mở quán"; }

function screens(w, h) {
  const g = snap.gate;
  if (g === "menu") {
    const p = panel(w, h, 640, 400, "Quán Ăn Chợ Nổi");
    lines([modeTitle() + (snap.catalog && snap.catalog.days > 1 ? " · " + snap.catalog.days + " ngày" : ""), "",
      "WASD / mũi tên: bơi, đi    E: hái, cập bến, bếp, bàn", "Space: bắt cá    Esc / P: tạm dừng    R: chơi lại", "H: tương phản cao (" + (hc ? "đang bật" : "đang tắt") + ")"], w / 2, p.y + 100, { align: "center", color: "#cfd8dc" });
    button(w / 2 - 110, p.y + 290, 220, 52, "Bắt đầu (Enter)", advance);
  } else if (g === "day_intro") {
    const p = panel(w, h, 760, 360, "Ngày " + (snap.day || 1) + (snap.catalog && snap.catalog.days > 1 ? " / " + snap.catalog.days : ""));
    lines(["Buổi sáng: lặn hái nguyên liệu rồi về bến (E) trước khi hết giờ.", ...planLines(), "Nhớ hít thở: oxy hết thì ngạt, ngất là mất cả giỏ."], p.x + 30, p.y + 100, { gap: 34 });
    button(w / 2 - 110, p.y + 290, 220, 52, "Xuống nước (Enter)", advance);
  } else if (g === "evening_intro") {
    const p = panel(w, h, 760, 360, "Buổi tối — mở quán");
    const sm = summarize(stockItems(snap.stock));
    lines(["Kho hôm nay: " + (sm.text || "(trống)"), ...(sm.bad ? ["Có " + sm.bad + " món nguyên liệu đã ươn (tươi < " + spoiledBelow() + ")."] : []), ...planLines(), "Bếp → nấu, bàn khách → phục vụ. Khách chờ lâu sẽ bỏ đi."], p.x + 30, p.y + 100, { gap: 34 });
    button(w / 2 - 110, p.y + 290, 220, 52, "Mở quán (Enter)", advance);
  } else if (g === "day_result") {
    const p = panel(w, h, 700, 340, "Kết quả ngày " + (snap.day || 1));
    lines(["Tiền hiện có: " + (snap.money ?? 0) + "k", "Tổng thu: " + (snap.earned ?? 0) + "k", "Uy tín: " + (snap.reputation ?? 0).toFixed(1) + " / 5", "Điểm: " + (snap.score ?? 0)], p.x + 60, p.y + 110, { gap: 36 });
    button(w / 2 - 110, p.y + 262, 220, 52, "Vào Shop (Enter)", advance);
  }
}
function drawShop(w, h) {
  const shop = (snap.catalog && snap.catalog.shop) || {}, ups = shop.upgrades || {}, keys = Object.keys(ups);
  const p = panel(w, h, 760, 140 + keys.length * 96 + 90, "Shop — Ngày " + (snap.day || 1));
  text("Tiền: " + (snap.money ?? 0) + "k    Còn " + Math.ceil((snap.time_left_ticks || 0) / 60) + "s", w / 2, p.y + 80, { size: 20, align: "center" });
  keys.forEach((k, i) => {
    const y = p.y + 110 + i * 96, cur = (snap.upgrades || {})[k] || 0;
    const next = (ups[k] || []).find((lv) => lv.level === cur + 1);
    text((i + 1) + ". " + (UP_NAME[k] || k) + " — cấp " + cur, p.x + 30, y + 30, { size: 22 });
    text(next ? "Cấp " + next.level + ": " + upLabel(next) + "  ·  " + next.price + "k" : "Đã tối đa", p.x + 30, y + 60, { size: 18, color: "#b0bec5" });
    button(p.x + 560, y + 6, 170, 52, next ? "Mua " + next.price + "k" : "Tối đa", () => buy(k), { disabled: !next || (snap.money ?? 0) < next.price });
  });
  if (!keys.length) text("Chưa có mặt hàng nào.", w / 2, p.y + 130, { size: 20, align: "center", color: "#b0bec5" });
  const by = p.y + 140 + keys.length * 96;
  button(w / 2 - 120, by, 240, 52, "Xong · ngày kế (Enter)", () => pulse("shop_done"));
}
function drawSummary(w, h) {
  const p = panel(w, h, 700, 360, "Tổng kết");
  lines(["Hoàn thành " + (snap.days_completed ?? (snap.catalog && snap.catalog.days) ?? 1) + " ngày", "Tổng thu: " + (snap.earned ?? 0) + "k", "Uy tín: " + (snap.reputation ?? 0).toFixed(1) + " / 5", "Điểm: " + (snap.score ?? 0)], p.x + 60, p.y + 110, { gap: 36 });
  button(w / 2 - 110, p.y + 280, 220, 52, "Chơi lại (R)", restart);
}
function drawPause(w, h) {
  const p = panel(w, h, 480, 260, "Tạm dừng");
  button(w / 2 - 110, p.y + 100, 220, 52, "Tiếp tục (Esc)", () => pulse("pause"));
  button(w / 2 - 110, p.y + 170, 220, 52, "Chơi lại (R)", restart);
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished && snap.mode === "day") { drawSummary(w, h); return; }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.phase === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = hc ? "#000000" : "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = hc ? "#000000" : g; ctx.fillRect(sx(0), oy, X * s, D * s);
  if (hc) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(sx(0), oy, X * s, D * s); }
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill(); hcStroke();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill(); hcStroke();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // thủy quái / Cá Sấu (nếu sim có `monsters[]`)
  // gần = đang đuổi hoặc trong detect_radius của loài (đọc từ meta = tuning.gather)
  const p = snap.player;
  const species = (meta.monsters && meta.monsters.species) || {};
  let chased = false, near = false;
  (snap.monsters || []).forEach((m) => {
    if (!m.pos) return;
    const r = (species[m.kind] || {}).detect_radius;
    const close = m.state === "chase" || (p && p.pos && r !== undefined && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= r);
    if (m.state === "chase") chased = true;
    if (close) near = true;
    ctx.save(); ctx.translate(sx(m.pos[0]), sy(m.pos[1]));
    ctx.fillStyle = hc ? "#ff00ff" : m.state === "chase" ? "#7e57c2" : "#4a6b3a";
    ctx.beginPath(); ctx.ellipse(0, 0, 2.2 * s, 0.8 * s, 0, 0, Math.PI * 2); ctx.fill(); hcStroke();
    ctx.beginPath(); ctx.moveTo(-2 * s, 0); ctx.lineTo(-3.2 * s, -0.7 * s); ctx.lineTo(-3.2 * s, 0.7 * s); ctx.fill();
    ctx.restore();
    text(m.id || "", sx(m.pos[0]), sy(m.pos[1]) - 1 * s, { size: 11, align: "center", color: "#d1c4e9" });
    if (close) warnIcon(sx(m.pos[0]), sy(m.pos[1]) - 2.2 * s, 24, hc ? "#ffff00" : "#ce93d8", "#000000");
  });
  // người chơi
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill(); hcStroke();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  const hurry = snap.time_left_ticks <= 30 * 60;
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: hurry && Math.floor(snap.time_left_ticks / 15) % 2 ? "#ff5252" : hurry ? "#ff8a80" : "#e8eef2" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (chased) {
    ctx.strokeStyle = hc ? "#ffffff" : "rgba(171,71,188,.85)"; ctx.lineWidth = 10;
    if (hc) ctx.setLineDash([24, 12]);
    ctx.strokeRect(5, 5, w - 10, h - 10); ctx.setLineDash([]);
  }
  const alerts = [];
  if (near) alerts.push([chased ? "Thủy quái đang đuổi!" : "Thủy quái gần!", "#ce93d8"]);
  const underwaterNow = p && p.at_surface === false;
  if (underwaterNow && p.oxygen_ticks === 0) alerts.push(["Hết hơi! Lên mặt nước", "#ff5252"]);
  else if (underwaterNow && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25) alerts.push(["Oxy sắp hết! " + Math.ceil(p.oxygen_ticks / 60) + "s", "#ff8a80"]);
  if (!snap.finished) alerts.forEach(([msg, col], i) => warn(msg, w / 2, 240 + i * 54, col));
  if (hc) text("Tương phản cao: BẬT (H)", 14, 74, { size: 14 });
  // danh sách cần lấy (ngày): nguyên liệu kế hoạch trừ phần đã có trong giỏ
  const need = (snap.day_plan && snap.day_plan.ingredients) || {};
  const have = {}; itemsOf(snap.hold).forEach((it) => { if (!isSpoiled(it)) have[it.kind] = (have[it.kind] || 0) + 1; });
  const nk = Object.keys(need).sort();
  if (nk.length) {
    ctx.fillStyle = "rgba(8,14,20,.82)"; ctx.fillRect(w - 190, 6, 184, 40 + nk.length * 20);
    text("Cần lấy", w - 14, 28, { size: 16, align: "right", color: "#ffe082" });
    nk.forEach((k, i) => { const got = Math.min(have[k] || 0, need[k]); text((KIND_NAME[k] || k) + " " + got + "/" + need[k], w - 14, 50 + i * 20, { size: 15, align: "right", color: got >= need[k] ? "#a5d6a7" : "#e8eef2" }); });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom - 6, held = itemsOf(snap.hold);
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const it = held[i];
      if (!it) continue;
      const bad = isSpoiled(it);
      ctx.globalAlpha = bad ? 0.45 : 1;
      ctx.fillStyle = kc(it.kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
      ctx.globalAlpha = 1;
      if (it.fresh !== null) {                                  // thanh độ tươi dưới ô
        ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(x0, y0 + sz + 2, sz, 4);
        ctx.fillStyle = freshColor(it.fresh); ctx.fillRect(x0, y0 + sz + 2, sz * Math.max(0, Math.min(1, it.fresh / 100)), 4);
      }
      if (bad) {                                                // hàng ươn: viền + gạch chéo đỏ
        ctx.strokeStyle = "#ef5350"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2);
        ctx.beginPath(); ctx.moveTo(x0 + 3, y0 + 3); ctx.lineTo(x0 + sz - 3, y0 + sz - 3); ctx.stroke();
      }
    }
    const sm = summarize(held);
    text("Giỏ " + held.length + "/" + cap + "  " + sm.text, 14, y0 + sz + 22, { size: 13, color: sm.bad ? "#ff8a80" : "#cfd8dc" });
    if (sm.bad) text("Có " + sm.bad + " món ươn (tươi < " + spoiledBelow() + ")", w / 2, h - 44, { size: 16, align: "center", color: "#ff8a80" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · Esc tạm dừng · R chơi lại · H tương phản cao", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = hc ? "#000000" : "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = hc ? "#ffffff" : "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    if (hc) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s); }
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111", keep: true });
    if (st.dish) text(dishName(st.dish), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 14, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      const total = ((((snap.catalog || {}).menu || {})[st.dish] || {}).cook_s || 0) * 60;
      if (total) bar(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) + 1.0 * s, 1.6 * s, 8, 1 - st.cook_ticks_left / total, "#ffb74d");
      text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.0 * s + 26, { size: 18, align: "center", color: "#2a1a0a" });
    }
    if (st.state === "ready") text("Chín!", sx(st.pos[0]), sy(st.pos[1]) + 1.0 * s + 22, { size: 18, align: "center", color: "#1b5e20" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill(); hcStroke();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill(); hcStroke();
      text(dishName(c.dish_id), cx, cy - 0.75 * s, { size: 14, align: "center", color: "#2a1a0a" });
      if (c.patience_ticks_left !== undefined) {
        const f = c.patience_ticks_left / patMax, low = c.state === "waiting" && f < 0.25;
        const blink = low && Math.floor(snap.tick / 12) % 2;
        bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 8, f, low ? (blink ? "#ffffff" : "#d50000") : hc ? "#ffffff" : "#e57373");
        if (low) warnIcon(cx + 0.9 * s, cy - 0.3 * s, 26, hc ? "#ffff00" : "#ff5252", "#000000");
      }
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill(); hcStroke();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + dishName(hand), px, py - 0.8 * s, { size: 16, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  const hurryQ = snap.time_left_ticks <= 30 * 60;
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 30, { size: 22, color: hurryQ && Math.floor(snap.time_left_ticks / 15) % 2 ? "#ff5252" : hurryQ ? "#ff8a80" : "#e8eef2" });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 120, 30, { size: 20 });
  const sm = summarize(stockItems(snap.stock));
  text("Kho: " + (sm.text || "(trống)"), 14, 56, { size: 18, color: sm.bad ? "#ff8a80" : "#cfd8dc" });
  const waiting = (snap.customers || []).filter((c) => c.state === "waiting");
  const angry = waiting.filter((c) => c.patience_ticks_left < patMax * 0.25);
  waiting.slice(0, 5).forEach((c, i) => text((angry.includes(c) ? "! " : "") + `${c.table_id}: ${dishName(c.dish_id)} · ${Math.ceil((c.patience_ticks_left || 0) / 60)}s`, w - 14, 30 + i * 24, { size: 18, align: "right", color: angry.includes(c) ? "#ff8a80" : "#e8eef2" }));
  if (angry.length && !snap.finished) warn("Khách sắp giận! " + angry.map((c) => c.table_id).join(", "), w / 2, h - 60, "#ff8a80");
  if (hc) text("Tương phản cao: BẬT (H)", 14, 80, { size: 14 });
  text("WASD/mũi tên đi · E bếp / bàn · Esc tạm dừng · R chơi lại · H tương phản cao", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    hits = [];
    const scene = snap.phase || snap.mode;
    if (scene === "quan") drawQuan(w, h); else if (scene === "shop") { ctx.fillStyle = "#16212b"; ctx.fillRect(0, 0, w, h); } else drawGather(w, h);
    if (!snap.gate && scene !== "shop" && !snap.finished) eventLog(w, h);
    drawToasts(w);
    overlay(w, h);
    if (snap.gate) screens(w, h);
    else if (scene === "shop" && !snap.finished) drawShop(w, h);
    else if (snap.state === "paused" && !snap.finished) drawPause(w, h);
    if (BENCH) benchFrame();
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
// Bench: báo /bench/ready ở khung đầu có snapshot, bỏ `warmup` giây, gửi khoảng cách giữa các khung (ms) trong `duration` giây.
const bench = { start: null, last: null, dts: [], sent: false };
function benchFrame() {
  const now = performance.now();
  if (bench.start === null) { bench.start = bench.last = now; sendRaw("/bench/ready"); return; }
  if (bench.sent) return;
  if (now - bench.start < BENCH.warmup * 1000) { bench.last = now; return; }
  bench.dts.push(now - bench.last);
  bench.last = now;
  if (now - bench.start >= (BENCH.warmup + BENCH.duration) * 1000) { bench.sent = true; sendRaw("/bench", { dts: bench.dts }); }
}
if (BENCH) { cv.style.width = "1280px"; cv.style.height = "720px"; }
requestAnimationFrame(frame);
</script>
